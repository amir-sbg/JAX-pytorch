[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-pytorch-bridge-lab"
version = "0.1.0"
description = "A dual-backend regression pipeline implemented in both PyTorch and JAX."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "jax>=0.4.30",
  "jaxlib>=0.4.30",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dual-backend-regression = "dual_backend.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
